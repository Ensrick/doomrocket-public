title = "Warlock Engineer v0.1.59-alpha";
description = "[h1][b][i]“The ingenious minds of Clan Skryre have developed a new device to sow explosive death from afar. Following Skratch’s failure to use the Warp Bomb and the Well of Dreams against Helmgart, Clan Fester has secured the aid of several Clan Skryre Warlock Engineers to field-test their Doomrockets—and the Ubersreik Five will make excellent target practice.”[/i][/b][/h1]

[h2]Warprocket Bombardiers[/h2]
This mod adds a new Skaven special enemy to the game: the Warprocket Bombardier, armed with a rocket launcher.

Players can shoot an incoming rocket to detonate it before it reaches its target.

[h2]Public alpha[/h2]
[b]This is the public alpha build.[/b] Version 0.1.59-alpha promotes the fixes accepted in TEST: career-switch and explosion safety, preserved reloads after shoves, quicker shoves and sustained retreat, backpack smoke, visible hose physics, and working custom sounds that stop combat voice on death. It keeps the new Workshop thumbnail and existing body, weapon and portrait artwork.

Open-ground retreats run for 8–12 seconds and seek greater separation. Tight fences and rare vaults can still look awkward. The hose retains its tested secondary motion; a firmer resting curve is still being reviewed. Hand/weapon sway, close-range ground shots, further audio polish and balance changes remain open development work.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warlock Engineer in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have this same build installed and enabled. Only the host controls spawning.

[h2]Release channels[/h2]
Do not enable the public alpha together with the TEST build.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3794172730]Experimental TEST build[/url]
[url=https://github.com/Ensrick/doomrocket-public/issues/new/choose]Report a public-alpha bug[/url]

[h2]Bug reports and feedback[/h2]
Use the issue chooser above and select [b]Gameplay or presentation bug[/b], [b]Crash report[/b], or [b]Balance or design feedback[/b].

Before reporting, restart the game after the Workshop update, confirm the console log contains [code][doomrocket:LOAD] v0.1.59-alpha[/code], and make sure the TEST build is disabled. A solo check is sufficient. Include a written description, exact reproduction steps, and the complete matching console log. No video or extra player is required.

Attach the complete log from [code]%APPDATA%\Fatshark\Vermintide 2\console_logs\[/code]. For crashes, also include the crash GUID or Crashify link. Logs and issue attachments are public, so review them before uploading.

[h2]Credits and source[/h2]
