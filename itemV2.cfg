Rocket damage is what a hero takes before talents, traits and other damage reduction. Damage drops sharply just outside 1.5 m. Other enemies take 40% less. Cataclysm 2 and 3 need a mod that unlocks them.

[h2]Public alpha[/h2]
[b]This is the public alpha build.[/b] Version 0.1.60-alpha promotes the tested improvements from v0.1.98-dev: a green crystal flame, quieter custom sounds, a W-shaped hose with its accepted secondary motion, more convincing vaulting and landing, and improved weapon handling and rocket impacts. Existing character and weapon artwork is retained.

The Engineer can shove every 2 seconds within 2.2 metres, then retreat at 4 m/s. On open ground he retreats for 8-12 seconds, seeking at least 20 metres of separation. Blocked routes and interruptions can end the retreat earlier.

The hose's resting W could still be stronger, and it has no body, wall or self-collision. Further presentation and compatibility refinements remain in development. Please report problems encountered during ordinary play.

[h2]Requirements[/h2]
[url=https://steamcommunity.com/sharedfiles/filedetails/?id=1369573612]Vermintide Mod Framework[/url] is required. In the Vermintide mod launcher, enable it and place it above Warlock Engineer in the load order.

Launch the [b]Modded Realm[/b]. This mod is unsanctioned and is not available in the Official Realm.

[h2]Installation and spawning[/h2]
Warprocket Bombardiers are enabled automatically and join the normal specials pool. The host’s conflict director spawns them according to the usual special-enemy cadence; there is no chat command to toggle them.

Every player in the lobby must have this same build installed and enabled. Only the host controls spawning.

[h2]Release channels[/h2]
Do not enable the public alpha together with the TEST build.

[url=https://steamcommunity.com/sharedfiles/filedetails/?id=3794172730]Experimental TEST build[/url]
