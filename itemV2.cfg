[h2]Bug reports and feedback[/h2]
Use the issue chooser above and select [b]Gameplay or presentation bug[/b], [b]Crash report[/b], or [b]Balance or design feedback[/b].

Before reporting, restart the game after the Workshop update, confirm the console log contains [code][doomrocket:LOAD] v0.1.60-alpha[/code], and make sure the TEST build is disabled. A solo check is sufficient. Include a written description, exact reproduction steps, and the complete matching console log. No video or extra player is required.

Attach the complete log from [code]%APPDATA%\Fatshark\Vermintide 2\console_logs\[/code]. For crashes, also include the crash GUID or Crashify link. Logs and issue attachments are public, so review them before uploading.

