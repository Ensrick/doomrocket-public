name: Repository quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check release-channel and repository metadata
        run: python tools/check_repository.py --channel public

      - name: Run retargeting math tests
        run: python tools/tests/test_warlock_retarget_math.py

      - name: Run texture and material source tests
        run: python tools/tests/test_warlock_texture_pipeline.py

      - name: Run weapon source and contract tests
        run: python tools/tests/test_warlock_weapon_pipeline.py

      - name: Run ragdoll regression tests
        shell: pwsh
        run: ./tools/tests/Test-WarlockRagdollRegressions.ps1
